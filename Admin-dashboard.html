<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة المشرف العام | SITEJ</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{--navy:#1a2942;--navy2:#3d5a7f;--blue:#4a90e2;--teal:#20c997;--purple:#8b5cf6;--red:#ee5a6f;--gray:#6b7c93;--line:rgba(74,144,226,.3)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Cairo',sans-serif;background:linear-gradient(180deg,#fff,#e8eef5 40%,#b8c9dc);min-height:100vh;color:#0a1628}
.hidden{display:none!important}
/* auth */
#authView{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{width:100%;max-width:460px;background:#fff;border:2px solid var(--line);border-radius:26px;box-shadow:0 24px 70px rgba(26,41,66,.18);overflow:hidden}
.tabs{display:flex;border-bottom:2px solid var(--line)}
.tabs button{flex:1;padding:16px;border:none;background:none;font:700 .95rem Cairo;color:var(--gray);cursor:pointer}
.tabs button.on{color:var(--blue);box-shadow:inset 0 -3px var(--blue)}
.pad{padding:28px 34px 34px}
.head{text-align:center;margin-bottom:20px}
.head .ic{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,var(--navy),var(--navy2));display:flex;align-items:center;justify-content:center;margin:0 auto 12px;color:#87ceeb;font-size:1.6rem}
.head h1{font-size:1.4rem;font-weight:900;color:var(--navy)}
.head p{font-size:.85rem;color:var(--gray)}
.f{margin-bottom:13px}
.f label{display:block;font-weight:700;font-size:.85rem;margin-bottom:6px}
.f input{width:100%;padding:12px 14px;border:2px solid var(--line);border-radius:13px;font:inherit;outline:none}
.f input:focus{border-color:var(--blue)}
.btn{width:100%;padding:14px;border:none;border-radius:13px;background:linear-gradient(135deg,var(--navy),var(--navy2));color:#87ceeb;font:800 1rem Cairo;cursor:pointer;margin-top:6px}
.btn:disabled{opacity:.6}
/* dashboard */
header{display:flex;justify-content:space-between;align-items:center;padding:16px 32px;background:rgba(255,255,255,.9);border-bottom:2px solid var(--line);position:sticky;top:0;z-index:50}
header .t{font-weight:900;font-size:1.3rem;color:var(--navy)}
header .t small{font-weight:600;font-size:.8rem;color:var(--gray);margin-right:8px}
.out{padding:9px 18px;border:none;border-radius:50px;background:var(--red);color:#fff;font:700 .85rem Cairo;cursor:pointer}
main{max-width:1300px;margin:0 auto;padding:24px 20px 60px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:22px}
.stat{background:#fff;border:2px solid var(--line);border-radius:18px;padding:18px;display:flex;align-items:center;gap:14px;cursor:pointer}
.stat i{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:1.2rem}
.stat b{font-size:1.7rem;display:block;line-height:1}
.stat span{font-size:.8rem;color:var(--gray);font-weight:600}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.bar button{padding:10px 18px;border:2px solid var(--line);border-radius:50px;background:#fff;font:700 .88rem Cairo;cursor:pointer;color:var(--navy)}
.bar button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.bar input{flex:1;min-width:200px;padding:10px 16px;border:2px solid var(--line);border-radius:50px;font:inherit;outline:none}
.wrap{background:#fff;border:2px solid var(--line);border-radius:18px;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th{background:var(--navy);color:#fff;padding:12px 14px;text-align:right;white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid #e8eef5;vertical-align:top}
tr:hover td{background:#f4f8fd}
.tag{display:inline-block;background:rgba(74,144,226,.12);color:var(--blue);padding:2px 10px;border-radius:50px;font-size:.78rem;font-weight:700;margin:2px}
.mini{padding:6px 14px;border:none;border-radius:50px;background:var(--blue);color:#fff;font:700 .78rem Cairo;cursor:pointer}
.empty{padding:40px;text-align:center;color:var(--gray)}
.modal{position:fixed;inset:0;background:rgba(26,41,66,.7);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
.mbox{background:#fff;border-radius:22px;max-width:600px;width:100%;max-height:88vh;overflow:auto;padding:24px}
.mbox h2{margin-bottom:14px;color:var(--navy)}
.kv{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid #eef2f7;font-size:.9rem}
.kv b{min-width:130px;color:var(--gray)}
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 24px;border-radius:50px;opacity:0;pointer-events:none;transition:.3s;z-index:300;max-width:90vw}
.toast.show{opacity:1}
</style>
</head>
<body>

<!-- ═══ شاشة الدخول / إنشاء حساب المشرف ═══ -->
<div id="authView">
  <div class="card">
    <div class="tabs">
      <button id="tLogin" class="on" onclick="authTab('login')"><i class="fas fa-sign-in-alt"></i> تسجيل الدخول</button>
      <button id="tReg" onclick="authTab('reg')"><i class="fas fa-user-plus"></i> إنشاء حساب</button>
    </div>
    <div class="pad">
      <div class="head"><div class="ic"><i class="fas fa-shield-halved"></i></div><h1>المشرف العام</h1><p id="authSub">سجّل دخولك للوصول للوحة الإدارة</p></div>
      <div id="regOnly" class="hidden">
        <div class="f"><label>الاسم الكامل</label><input id="aName" placeholder="اسم المشرف"></div>
      </div>
      <div class="f"><label>البريد الإلكتروني</label><input id="aEmail" type="email" dir="ltr" placeholder="admin@school.com"></div>
      <div class="f"><label>كلمة المرور</label><input id="aPass" type="password" dir="ltr" placeholder="8 أحرف على الأقل"></div>
      <div id="regOnly2" class="hidden">
        <div class="f"><label>الرمز السري</label><input id="aCode" type="password" dir="ltr" placeholder="رمز المشرف"></div>
      </div>
      <button class="btn" id="authBtn" onclick="submitAuth()"><i class="fas fa-sign-in-alt"></i> دخول</button>
    </div>
  </div>
</div>

<!-- ═══ لوحة التحكم ═══ -->
<div id="dashView" class="hidden">
  <header>
    <div class="t"><i class="fas fa-shield-halved" style="color:var(--blue)"></i> لوحة المشرف العام <small id="adminName"></small></div>
    <button class="out" onclick="logout()"><i class="fas fa-power-off"></i> خروج</button>
  </header>
  <main>
    <div class="stats" id="stats"></div>
    <div class="bar">
      <button data-t="students" class="on">الطلاب</button>
      <button data-t="teachers">الأساتذة</button>
      <button data-t="vice_principal">مساعدو المدير</button>
      <button data-t="principal">المدراء</button>
      <button data-t="assignments">الواجبات</button>
      <input id="search" placeholder="🔍 بحث بالاسم أو البريد...">
    </div>
    <div class="wrap" id="tableWrap"></div>
  </main>
</div>

<div class="modal hidden" id="modal" onclick="if(event.target===this)closeModal()"><div class="mbox" id="mbox"></div></div>
<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, updateProfile, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
import { getFirestore, doc, getDoc, setDoc, collection, getDocs, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

const app = initializeApp({
  apiKey:"AIzaSyDJRA6KpLir1Jo-oVqqAANOglWEBXXn8oA",
  authDomain:"eliteacademy-37bfc.firebaseapp.com",
  projectId:"eliteacademy-37bfc",
  storageBucket:"eliteacademy-37bfc.firebasestorage.app",
  messagingSenderId:"203080953628",
  appId:"1:203080953628:web:69efebccc336b79f0554d9"
});
const auth = getAuth(app), db = getFirestore(app);

// ⚙️ إعدادات — عدّلها حسب مشروعك
const ADMIN_CODE = '2026_159';
const ASSIGNMENTS_COLLECTION = 'assignments';   // اسم كولكشن الواجبات عندك
const HIDDEN_FIELDS = ['password','uid'];        // حقول ما تنعرض أبداً

// لازم يكون المستخدم فات من صفحة الدخول بالكود السري
if (!sessionStorage.getItem('adminGate')) location.replace('login.html');

const $ = id => document.getElementById(id);
const toast = m => { $('toast').textContent = m; $('toast').classList.add('show'); setTimeout(()=>$('toast').classList.remove('show'),3500); };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = v => { if(!v) return '—'; const d = v.toDate ? v.toDate() : new Date(v); return isNaN(d) ? '—' : d.toLocaleString('ar-JO',{dateStyle:'medium',timeStyle:'short'}); };
const ts = v => { if(!v) return 0; const d = v.toDate ? v.toDate() : new Date(v); return +d || 0; };

let mode = 'login';
window.authTab = t => {
  mode = t;
  $('tLogin').classList.toggle('on', t==='login'); $('tReg').classList.toggle('on', t==='reg');
  $('regOnly').classList.toggle('hidden', t!=='reg'); $('regOnly2').classList.toggle('hidden', t!=='reg');
  $('authBtn').innerHTML = t==='login' ? '<i class="fas fa-sign-in-alt"></i> دخول' : '<i class="fas fa-user-plus"></i> إنشاء حساب مشرف';
  $('authSub').textContent = t==='login' ? 'سجّل دخولك للوصول للوحة الإدارة' : 'أنشئ حساب مشرف جديد (يحتاج الرمز السري)';
};

window.submitAuth = async () => {
  const email = $('aEmail').value.trim(), pass = $('aPass').value, btn = $('authBtn');
  if (!email || !pass) return toast('⚠️ أدخل البريد وكلمة المرور');
  btn.disabled = true;
  try {
    if (mode === 'reg') {
      const name = $('aName').value.trim();
      if (!name) throw {msg:'أدخل الاسم'};
      if (pass.length < 8) throw {msg:'كلمة المرور 8 أحرف على الأقل'};
      if ($('aCode').value.trim() !== ADMIN_CODE) throw {msg:'الرمز السري غير صحيح'};
      const cred = await createUserWithEmailAndPassword(auth, email, pass);
      await updateProfile(cred.user, {displayName:name});
      await setDoc(doc(db,'users',cred.user.uid), {fullName:name, firstName:name, email, role:'admin', status:'active', uid:cred.user.uid, createdAt:serverTimestamp()});
      toast('🎉 تم إنشاء حساب المشرف');
    } else {
      await signInWithEmailAndPassword(auth, email, pass);
    }
    // onAuthStateChanged يكمل
  } catch (e) {
    toast('❌ ' + (e.msg || ({'auth/email-already-in-use':'البريد مسجل مسبقاً','auth/invalid-credential':'بيانات الدخول غير صحيحة','auth/wrong-password':'كلمة المرور خاطئة','auth/user-not-found':'الحساب غير موجود','auth/weak-password':'كلمة المرور ضعيفة'}[e.code] || 'حدث خطأ، حاول مرة أخرى')));
  }
  btn.disabled = false;
};

window.logout = async () => { await signOut(auth); sessionStorage.removeItem('adminGate'); location.replace('login.html'); };

onAuthStateChanged(auth, async user => {
  if (!user) { $('authView').classList.remove('hidden'); $('dashView').classList.add('hidden'); return; }
  const snap = await getDoc(doc(db,'users',user.uid));
  if (!snap.exists() || snap.data().role !== 'admin') {
    await signOut(auth); toast('🚫 هذا الحساب ليس حساب مشرف');
    return;
  }
  $('adminName').textContent = '— ' + (snap.data().fullName || '');
  $('authView').classList.add('hidden'); $('dashView').classList.remove('hidden');
  loadData();
});

// ═══ البيانات ═══
let D = {students:[], teachers:[], vice_principal:[], principal:[], assignments:[]};
let tab = 'students';

async function loadData() {
  $('tableWrap').innerHTML = '<div class="empty">جاري التحميل...</div>';
  try {
    const [st, us, as] = await Promise.all([
      getDocs(collection(db,'students')),
      getDocs(collection(db,'users')),
      getDocs(collection(db, ASSIGNMENTS_COLLECTION)).catch(()=>({docs:[]}))
    ]);
    D.students = st.docs.map(d => ({id:d.id, ...d.data()}));
    const users = us.docs.map(d => ({id:d.id, ...d.data()}));
    D.teachers = users.filter(u => u.role==='teacher');
    D.vice_principal = users.filter(u => u.role==='vice_principal');
    D.principal = users.filter(u => u.role==='principal');
    D.assignments = as.docs.map(d => ({id:d.id, ...d.data()}));
  } catch (e) {
    $('tableWrap').innerHTML = '<div class="empty">❌ تعذر جلب البيانات — تأكد من قواعد Firestore (السماح للمشرف بالقراءة).</div>';
    return;
  }
  // ربط الواجبات بالأساتذة
  const tid = a => a.teacherId || a.teacherUid || a.uid || a.createdBy || a.authorId;
  D.teachers.forEach(t => {
    t._as = D.assignments.filter(a => tid(a) === t.id || tid(a) === t.uid).sort((a,b)=>ts(b.createdAt||b.date||b.timestamp)-ts(a.createdAt||a.date||a.timestamp));
  });
  renderStats(); render();
}

function renderStats() {
  const items = [
    ['students','الطلاب',D.students.length,'fa-user-graduate','var(--teal)'],
    ['teachers','الأساتذة',D.teachers.length,'fa-chalkboard-teacher','var(--blue)'],
    ['vice_principal','مساعدو المدير',D.vice_principal.length,'fa-star','var(--purple)'],
    ['principal','المدراء',D.principal.length,'fa-school','var(--navy2)'],
    ['assignments','الواجبات',D.assignments.length,'fa-book','var(--red)']
  ];
  $('stats').innerHTML = items.map(i => `<div class="stat" onclick="setTab('${i[0]}')"><i class="fas ${i[3]}" style="background:${i[4]}"></i><div><b>${i[2]}</b><span>${i[1]}</span></div></div>`).join('');
}

window.setTab = t => {
  tab = t;
  document.querySelectorAll('.bar button').forEach(b => b.classList.toggle('on', b.dataset.t === t));
  render();
};
document.querySelectorAll('.bar button').forEach(b => b.onclick = () => setTab(b.dataset.t));
$('search').oninput = () => render();

const classesTags = c => (c||[]).map(x => `<span class="tag">${esc(x)}</span>`).join('') || '—';

function render() {
  const q = $('search').value.trim().toLowerCase();
  const match = o => !q || JSON.stringify(Object.values(o).filter(v => typeof v === 'string')).toLowerCase().includes(q);
  let head, rows;
  if (tab === 'students') {
    head = ['الاسم','كود التفعيل','الصف','الشعبة','الحالة',''];
    rows = D.students.filter(match).map(s => [esc(s.name||s.fullName), esc(s.activationCode), esc(s.grade||s.class||'—'), esc(s.section||'—'), s.status==='banned'?'<span class="tag" style="color:var(--red)">محظور</span>':'<span class="tag">نشط</span>', btn('students',s.id)]);
  } else if (tab === 'teachers') {
    head = ['الاسم','البريد','الرقم الوظيفي','المادة','الصفوف','عدد الواجبات','آخر واجب',''];
    rows = D.teachers.filter(match).map(t => [esc(t.fullName), esc(t.email), esc(t.jobNumber), esc(t.subject), classesTags(t.classes), t._as.length, t._as[0] ? fmt(t._as[0].createdAt||t._as[0].date||t._as[0].timestamp) : '—', btn('teachers',t.id)]);
  } else if (tab === 'assignments') {
    head = ['العنوان','الأستاذ','الصف','تاريخ النشر'];
    const name = a => { const id = a.teacherId||a.teacherUid||a.uid||a.createdBy||a.authorId; const t = D.teachers.find(x=>x.id===id); return t ? t.fullName : (a.teacherName||'—'); };
    rows = D.assignments.filter(match).sort((a,b)=>ts(b.createdAt||b.date||b.timestamp)-ts(a.createdAt||a.date||a.timestamp)).map(a => [esc(a.title||a.name||'—'), esc(name(a)), esc(a.class||a.className||a.classes||'—'), fmt(a.createdAt||a.date||a.timestamp)]);
  } else {
    head = ['الاسم','البريد','تاريخ التسجيل','الحالة',''];
    rows = D[tab].filter(match).map(u => [esc(u.fullName), esc(u.email), fmt(u.createdAt), esc(u.status||'active'), btn(tab,u.id)]);
  }
  $('tableWrap').innerHTML = rows.length
    ? `<table><thead><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table>`
    : '<div class="empty">لا توجد بيانات</div>';
}
const btn = (k,id) => `<button class="mini" onclick="showDetails('${k}','${esc(id)}')">التفاصيل</button>`;

const LABELS = {name:'الاسم',fullName:'الاسم الكامل',firstName:'الاسم الأول',lastName:'اسم العائلة',email:'البريد',role:'الدور',status:'الحالة',jobNumber:'الرقم الوظيفي',subject:'المادة',classes:'الصفوف',activationCode:'كود التفعيل',activatedByCode:'كود التفعيل المستخدم',createdAt:'تاريخ التسجيل',emailVerified:'البريد مُوثّق',grade:'الصف',section:'الشعبة'};

window.showDetails = (k,id) => {
  const list = k==='students' ? D.students : D[k];
  const o = list.find(x => x.id === id); if (!o) return;
  const kv = Object.entries(o).filter(([key]) => !HIDDEN_FIELDS.includes(key) && key !== 'id' && !key.startsWith('_'))
    .map(([key,v]) => {
      let val = Array.isArray(v) ? v.join('، ') : (v && v.toDate) ? fmt(v) : (typeof v === 'object' && v) ? JSON.stringify(v) : v;
      return `<div class="kv"><b>${LABELS[key]||esc(key)}</b><span>${esc(val)}</span></div>`;
    }).join('');
  let extra = '';
  if (k === 'teachers') {
    extra = `<h3 style="margin:16px 0 8px">الواجبات المنشورة (${o._as.length})</h3>` +
      (o._as.length ? o._as.map(a => `<div class="kv"><b>${fmt(a.createdAt||a.date||a.timestamp)}</b><span>${esc(a.title||a.name||'—')}</span></div>`).join('') : '<div class="empty" style="padding:12px">لم ينشر أي واجب بعد</div>');
  }
  $('mbox').innerHTML = `<h2>${esc(o.fullName||o.name||'')}</h2>${kv}${extra}<button class="btn" style="margin-top:16px" onclick="closeModal()">إغلاق</button>`;
  $('modal').classList.remove('hidden');
};
window.closeModal = () => $('modal').classList.add('hidden');
</script>
</body>
</html>
